org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# The Gradle daemon's JDK is pinned in ~/.gradle/gradle.properties (user-level,
# machine-local) because the system default here is JDK 24. It is deliberately
# NOT set in this file: that would hardcode a Linux path and break builds from
# Windows Studio with its bundled JDK. See docs/DEVICE.md section 4.
